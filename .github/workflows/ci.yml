name: StayHive CI Hardening Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Security & Integrity Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stayhive
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check

      - name: Run Django Production Deployment Checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-secret-key-must-have-over-50-characters-and-high-entropy-here-for-stayhive!"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
        run: |
          cd backend
          python manage.py check --deploy

      - name: Run Migrations & Apply Database Fixtures
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "stayhive"
        run: |
          cd backend
          python manage.py migrate --noinput
          python database/migration_cp11.py

      - name: Run CP11 Comprehensive Test Suite
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "stayhive"
        run: |
          cd backend
          python test_checkpoint11.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
