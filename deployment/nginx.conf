# ==============================================================================
# StayHive Hospitality Platform — Production Nginx Configuration
# ==============================================================================

upstream stayhive_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stayhive.com www.stayhive.com api.stayhive.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Main HTTPS Server (Frontend SPA + API Reverse Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stayhive.com www.stayhive.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/stayhive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stayhive.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StayHiveSSL:10m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request limits & Buffers
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend SPA Root (React build artifact)
    root /var/www/stayhive/frontend/dist;
    index index.html;

    # API Proxy to Django / Gunicorn
    location /api/ {
        proxy_pass http://stayhive_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # Django Admin Static Files
    location /static/ {
        alias /var/www/stayhive/backend/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # User Media Uploads
    location /media/ {
        alias /var/www/stayhive/backend/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # React Static Assets Cache
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health Check Passthrough
    location /health/ {
        proxy_pass http://stayhive_backend/api/health/;
        proxy_set_header Host $host;
    }

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
